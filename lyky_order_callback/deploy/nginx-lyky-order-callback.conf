# Replace the hostname and certificate paths before enabling this server block.
server {
    listen 443 ssl http2;
    server_name callback.example.com;

    ssl_certificate     /etc/nginx/tls/callback.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/callback.example.com.key;
    client_max_body_size 1m;

    location = /callbacks/lyky/orders/original {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Keep health checks local or restrict this path in the upstream load balancer.
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8092;
    }
}
