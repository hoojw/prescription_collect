# Replace the server_name and certificate paths. Qimen requires a publicly
# reachable HTTP(S) backend; expose only Nginx/SLB and keep Python on 127.0.0.1.
server {
    listen 443 ssl http2;
    server_name alihealth-jst.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 27s;
    proxy_send_timeout 27s;

    location = /healthz {
        proxy_pass http://127.0.0.1:8088/healthz;
    }

    location / {
        limit_except POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8088;
    }
}
